<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sismorcego · Prévia no navegador</title>
    <style>
      @font-face { font-family: 'Feather'; src: url('/Feather.ttf') format('truetype'); }
      html, body { height: 100%; margin: 0; }
      body { background: #e9e6f1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: #4a4560; }
      .bar button { border: 1px solid #b7afd0; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; color: #2e1065; }
      .bar button:hover { background: #f3efff; }
      .bar small { max-width: 420px; text-align: center; }
      .phone { position: relative; width: 390px; height: 844px; max-height: calc(100vh - 110px); border-radius: 44px; border: 10px solid #1c1730; overflow: hidden; box-shadow: 0 30px 60px rgba(28,23,48,.35); background: #fff; transform-origin: top center; }
      #root { position: absolute; inset: 0; display: flex; }
      .status { position: absolute; top: 0; left: 0; right: 0; height: 47px; z-index: 9999; pointer-events: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 8px; color: #111; font-size: 15px; font-weight: 600; }
      .home { position: absolute; bottom: 7px; left: 50%; width: 130px; height: 5px; margin-left: -65px; border-radius: 3px; background: #111; opacity: .8; z-index: 9999; pointer-events: none; }
      input[type=date] { font-family: inherit; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span>Tema:</span>
      <button onclick="__setScheme('light')">Claro</button>
      <button onclick="__setScheme('dark')">Escuro</button>
      <button onclick="localStorage.clear(); location.href = '/'">Recomeçar</button>
      <small>Prévia no navegador com dados fictícios (nada é enviado). Alto contraste: Mais → Configurações.</small>
    </div>
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●●● 5G ▮</span></div>
      <div id="root"></div>
      <div class="home"></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
